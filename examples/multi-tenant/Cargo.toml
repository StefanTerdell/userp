# Multi-tenant SSO built on authery's provider-resolver primitive: per-org
# OIDC providers from the app's own tables, membership upserts in the store.
# Uses the dev Keycloak as the org's IdP.
[package]
name = "multi-tenant"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
authery = { path = "../..", default-features = false, features = [
  "user",
  "email",
  "password",
  "oauth",
  "pages",
  "axum",
] }
memory-store = { path = "../memory-store", features = [
  "user",
  "email",
  "password",
  "oauth",
] }
axum = "0.8.9"
axum-macros = "0.5.0"
tokio = { version = "1.52.3", features = ["full"] }
dotenv = "0.15.0"
urlencoding = "2.1.3"
tower-http = { version = "0.6.1", features = ["trace"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
