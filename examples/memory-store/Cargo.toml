# An in-memory AutheryStore, feature-gated exactly like a real store would
# be: enable a feature here and it both activates the matching authery
# feature and compiles the store methods it requires.
[package]
name = "memory-store"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
user = ["authery/user"]
password = ["authery/password"]
email = ["authery/email"]
oauth = ["authery/oauth"]
webauthn = ["authery/webauthn"]
totp = ["authery/totp"]
sms = ["authery/sms"]
mfa = ["authery/mfa"]

[dependencies]
authery = { path = "../..", default-features = false }
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["sync"] }
thiserror = "2.0.18"
