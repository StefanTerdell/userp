[package]
name = "memory-store-example"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
authery = { path = "../../authery", features = [
  "axum",
  "pages",
  "otp",
  "webauthn",
  "mfa",
  "totp",
  "sms-providers",
] }
axum = "0.8.9"
axum-macros = "0.5.0"
tokio = { version = "1.52.3", features = ["full"] }
urlencoding = "2.1.3"
askama = "0.16.0"
dotenv = "0.15.0"
tower-http = { version = "0.6.1", features = ["trace"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
thiserror = "2.0.18"
