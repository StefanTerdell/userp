# Every authery feature at once, over either store: memory by default, or
# Postgres when DATABASE_URL is set - same app code, the store swaps.
[package]
name = "full"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
authery = { path = "../..", features = [
  "axum",
  "pages",
  "otp",
  "webauthn",
  "mfa",
  "totp",
  "sms",
] }
memory-store = { path = "../memory-store", features = [
  "user",
  "password",
  "email",
  "otp",
  "oauth",
  "webauthn",
  "totp",
  "sms",
  "mfa",
] }
postgres-store = { path = "../postgres-store", features = [
  "user",
  "password",
  "email",
  "otp",
  "oauth",
  "webauthn",
  "totp",
  "sms",
  "mfa",
] }
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
askama = "0.16.0"
dotenv = "0.15.0"
urlencoding = "2.1.3"
tower-http = { version = "0.6.1", features = ["trace"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
