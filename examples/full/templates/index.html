{% extends "base.html" %}

{% block content %}
{% if logged_in %}
<p>You are logged in</p>
<form method="post" action="/logout"><button type="submit">Log out</button></form>
<a href="/user">Account</a>
{% else %}
<p>You are not logged in</p>
<a href="/login">Log in</a>
<a href="/signup">Sign up</a>
{% endif %}
{% endblock %}
