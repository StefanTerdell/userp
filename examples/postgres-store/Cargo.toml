[package]
name = "postgres-store-example"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
authery = { path = "../..", features = [
  "axum",
  "pages",
  "otp",
  "webauthn",
  "mfa",
  "totp",
  "sms",
] }
axum = "0.8.9"
axum-macros = "0.5.0"
tokio = { version = "1.52.3", features = ["full"] }
sqlx = { version = "0.8.3", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "uuid",
  "chrono",
  "json",
  "macros",
] }
dotenv = "0.15.0"
urlencoding = "2.1.3"
tower-http = { version = "0.6.1", features = ["trace"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
thiserror = "2.0.18"
