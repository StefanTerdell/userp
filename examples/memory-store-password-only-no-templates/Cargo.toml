[package]
name = "minimal-password-only-example"
version = "0.1.0"
edition = "2021"

[dependencies]
authery = { path = "../../authery", default-features = false, features = [
  "password",
  "axum",
] }
axum = "0.7.7"
axum-macros = "0.4.2"
tokio = { version = "1.40.0", features = ["full"] }
askama = { version = "0.12.1", features = ["with-axum"] }
askama_axum = "0.4.0"
tower-http = { version = "0.6.1", features = ["trace"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
password-auth = "1.0.0"
serde = { version = "1.0.210", features = ["derive"] }
