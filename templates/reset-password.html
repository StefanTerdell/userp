{% extends "base.html" %}

{% block content %}
<div class="form-container">
  <h1>Choose a new password</h1>

  {% if let Some(error) = error %}
  <div class="error" role="alert">
    <strong>Something went wrong: {{ error }}</strong>
  </div>
  {% endif %}

  <p class="text-muted">Setting a new password signs out every other session on this account.</p>

  <form action="{{ reset_password_action_route }}" method="post" id="reset-form">
    <div class="form-group">
      <label for="new_password">New password</label>
      <input type="password" id="new_password" name="new_password" autocomplete="new-password"
        {% if let Some(pattern) = pattern %}pattern="{{ pattern }}" {% endif %}required autofocus>
    </div>
    <button type="submit">Set new password</button>
  </form>

  {% if let Some(hint) = pattern_hint %}
  <p class="text-muted">{{ hint }}</p>
  {% endif %}
</div>
{% endblock %}
