<script>
  /* Shared passkey ceremonies. Marshalling uses the b64url helpers from
     base.html; callers supply URLs and handle success/failure. */
  async function passkeyGet(startUrl, finishUrl) {
    var res = await fetch(startUrl, { method: 'POST' });
    var rcr = await res.json();
    if (!res.ok) { throw rcr.error || res.status; }
    var pk = rcr.publicKey;
    pk.challenge = fromB64url(pk.challenge);
    if (pk.allowCredentials) {
      pk.allowCredentials = pk.allowCredentials.map(function (c) {
        c.id = fromB64url(c.id); return c;
      });
    }
    var cred = await navigator.credentials.get({ publicKey: pk });
    var body = {
      id: cred.id,
      rawId: toB64url(cred.rawId),
      type: cred.type,
      extensions: cred.getClientExtensionResults(),
      response: {
        authenticatorData: toB64url(cred.response.authenticatorData),
        clientDataJSON: toB64url(cred.response.clientDataJSON),
        signature: toB64url(cred.response.signature),
        userHandle: cred.response.userHandle ? toB64url(cred.response.userHandle) : null
      }
    };
    var fin = await fetch(finishUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    var out = await fin.json();
    if (!fin.ok) { throw out.error || fin.status; }
    return out;
  }

  async function passkeyCreate(startUrl, finishUrl, registration) {
    var res = await fetch(startUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(registration)
    });
    var ccr = await res.json();
    if (!res.ok) { throw ccr.error || res.status; }
    var pk = ccr.publicKey;
    pk.challenge = fromB64url(pk.challenge);
    pk.user.id = fromB64url(pk.user.id);
    if (pk.excludeCredentials) {
      pk.excludeCredentials = pk.excludeCredentials.map(function (c) {
        c.id = fromB64url(c.id); return c;
      });
    }
    var cred = await navigator.credentials.create({ publicKey: pk });
    var fin = await fetch(finishUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: cred.id,
        rawId: toB64url(cred.rawId),
        type: cred.type,
        extensions: cred.getClientExtensionResults(),
        response: {
          attestationObject: toB64url(cred.response.attestationObject),
          clientDataJSON: toB64url(cred.response.clientDataJSON)
        }
      })
    });
    if (!fin.ok) { var out = await fin.json(); throw out.error || fin.status; }
  }
</script>
