[package]
name = "authery"
version = "0.1.0"
edition = "2024"
exclude = [".github/*"]
description = "Batteries-included authentication for Axum: sessions, passwords, email links & one-time codes, OAuth/OIDC, passkeys and MFA over storage you bring"
license = "ISC"
repository = "https://github.com/StefanTerdell/userp"
homepage = "https://github.com/StefanTerdell/userp"
readme = "../README.md"
keywords = ["authentication", "axum", "oauth", "oidc", "webauthn"]
categories = ["authentication", "web-programming"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
uuid = { version = "1.23.5", features = ["serde", "v4"] }
# Session expiry is a core concern, so chrono is always on.
chrono = { version = "0.4.45", features = ["serde"] }

# email
lettre = { version = "0.11.22", features = [
  "tokio1",
  "tokio1-native-tls",
], optional = true }
url = { version = "2.5.8", optional = true }

# password
password-auth = { version = "1.0.0", optional = true }
tokio = { version = "1.52.3", features = ["rt"], optional = true }

# totp
totp-rs = { version = "5.7.2", features = [
  "gen_secret",
  "otpauth",
  "qr",
], optional = true }

# webauthn
webauthn-rs = { version = "0.5.5", features = [
  "danger-allow-state-serialisation",
  "conditional-ui",
], optional = true }
webauthn-rs-proto = { version = "0.5.5", optional = true }

# oauth
anyhow = { version = "1.0.103", optional = true }
jsonwebtoken = { version = "10.4.0", default-features = false, features = [
  "rust_crypto",
], optional = true }
oauth2 = { version = "5.0.0", optional = true }
reqwest = { version = "0.12.8", features = ["json"], optional = true }
serde_json = { version = "1.0.150", optional = true }

# pages
askama = { version = "0.16.0", optional = true }

# axum
axum = { version = "0.8.9", features = ["macros"], optional = true }
axum-extra = { version = "0.12.6", features = [
  "cookie-private",
], optional = true }
urlencoding = { version = "2.1.3", optional = true }

[features]
default = ["user", "email", "password", "oauth"]
user = []
email = ["dep:lettre", "dep:url"]
otp = ["email"]
mfa = []
totp = ["dep:totp-rs"]
sms = []
sms-providers = ["sms", "dep:reqwest", "dep:serde_json"]
webauthn = [
  "dep:webauthn-rs",
  "dep:webauthn-rs-proto",
  "dep:url",
  "dep:serde_json",
]
password = ["dep:password-auth", "dep:tokio"]
oauth = [
  "dep:oauth2",
  "dep:url",
  "dep:anyhow",
  "dep:reqwest",
  "dep:serde_json",
  "dep:jsonwebtoken",
]
pages = ["dep:askama"]
axum = ["dep:axum", "dep:axum-extra", "dep:urlencoding"]

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
totp-rs = { version = "5.7.2", features = ["gen_secret", "otpauth"] }
reqwest = { version = "0.12.8", features = ["json"] }
serde_json = "1.0.150"

