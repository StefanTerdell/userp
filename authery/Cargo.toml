[package]
name = "authery"
version = "0.1.0"
edition = "2021"
exclude = [".github/*"]
description = "Authery is a composable auth system with OAuth/OIDC, password and email support, and a ready-made Axum router with replaceable pages"
license = "ISC"
repository = "https://github.com/StefanTerdell/userp"
homepage = "https://github.com/StefanTerdell/userp"

[dependencies]
serde = { version = "1.0.210", features = ["derive"] }
thiserror = "1.0.64"
uuid = { version = "1.10.0", features = ["serde", "v4"] }

# email
chrono = { version = "0.4.38", optional = true, features = ["serde"] }
lettre = { version = "0.11.9", optional = true }
url = { version = "2.5.2", optional = true }

# password
password-auth = { version = "1.0.0", optional = true }
tokio = { version = "1.40.0", features = ["rt"], optional = true }

# oauth
anyhow = { version = "1.0.89", optional = true }
base64 = { version = "0.22.1", optional = true }
oauth2 = { version = "4.4.2", optional = true }
reqwest = { version = "0.12.8", features = ["json"], optional = true }
serde_json = { version = "1.0.128", optional = true }

# pages
askama = { version = "0.12.1", optional = true }
askama_axum = { version = "0.4.0", optional = true }

# axum
axum = { version = "0.7.7", features = ["macros"], optional = true }
axum-extra = { version = "0.9.4", features = [
  "cookie-private",
], optional = true }
urlencoding = { version = "2.1.3", optional = true }

[features]
default = ["user", "email", "password", "oauth"]
user = []
email = ["dep:lettre", "dep:url", "dep:chrono"]
password = ["dep:password-auth", "dep:tokio"]
oauth = [
  "dep:oauth2",
  "dep:url",
  "dep:anyhow",
  "dep:chrono",
  "dep:reqwest",
  "dep:base64",
  "dep:serde_json",
]
pages = ["dep:askama"]
axum = ["dep:axum", "dep:axum-extra", "dep:urlencoding", "dep:askama_axum"]
